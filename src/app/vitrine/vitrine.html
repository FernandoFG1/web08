<div class="row">
  <div class="col-md-4 mb-4" *ngFor="let obj of lista">
    <div class="card h-100">
      <img src="assets/{{obj.codigo}}.jpg" class="card-img-top p-3" [alt]="obj.nome" style="height: 200px; object-fit: contain;">
      <div class="card-body d-flex flex-column">
        <h5 class="card-title fs-6">{{obj.nome}}</h5>
        <p class="card-text small text-muted text-truncate">{{obj.descritivo}}</p>
        <div class="mt-auto">
          <div class="mb-2" *ngIf="obj.valorPromo > 0">
            <small class="text-muted text-decoration-line-through">de: R$ {{obj.valor}}</small><br>
            <span class="text-success fw-bold">por: R$ {{obj.valorPromo}}</span>
          </div>
          <div class="mb-2" *ngIf="obj.valorPromo == 0">
            <span class="fw-bold">por: R$ {{obj.valor}}</span>
          </div>
          <div class="d-flex gap-2">
            <a [routerLink]="['/detalhe', obj.codigo]" class="btn btn-outline-primary w-50">ver +</a>
            <button class="btn btn-outline-success w-50" (click)="adicionarEComprar(obj)">comprar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
