<div class="container my-4" *ngIf="produto">
  <div class="row align-items-center">
    <div class="col-md-5 text-center">
      <img src="assets/{{produto.codigo}}.jpg" class="img-fluid rounded" [alt]="produto.nome" style="max-height: 300px;">
    </div>

    <div class="col-md-7">
      <h2 class="text-danger">{{produto.nome}}</h2>
      <p class="text-muted">{{produto.descritivo}}</p>
      
      <div class="mb-3">
        <h3 class="text-success fw-bold" *ngIf="produto.valorPromo > 0">
          R$ {{produto.valorPromo}} 
          <small class="text-muted text-decoration-line-through fs-6">R$ {{produto.valor}}</small>
        </h3>
        <h3 class="fw-bold" *ngIf="produto.valorPromo == 0">R$ {{produto.valor}}</h3>
      </div>

      <div class="d-flex align-items-center gap-3 mb-4">
        <span class="fw-bold">Quantidade:</span>
        <div class="btn-group">
          <button class="btn btn-outline-secondary" (click)="diminuirQtd()">-</button>
          <span class="btn btn-light px-3 disabled fw-bold text-dark">{{quantidadeDesejada}}</span>
          <button class="btn btn-outline-secondary" (click)="aumentarQtd()">+</button>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-success btn-lg" (click)="comprar()">Comprar Agora</button>
        <a routerLink="/vitrine" class="btn btn-outline-secondary btn-lg">Voltar</a>
      </div>
    </div>
  </div>
</div>
