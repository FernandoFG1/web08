<div class="cadastro-wrapper py-3">
  <div class="cadastro-card mx-auto">
    <div class="cadastro-header text-center">
      <h3 class="mb-1 fw-bold text-white">Cadastro de Cliente</h3>
      <p class="mb-0 small text-light-muted">Crie sua conta na MetalHorse Performance</p>
    </div>

    <div class="p-4">
      <div *ngIf="mensagem && !cadastroSucesso" class="alert alert-danger py-2 px-3 small mb-3">
        {{ mensagem }}
      </div>

      <form (ngSubmit)="finalizarCadastro()">
        <div class="mb-3">
          <label class="form-label form-label-mh">Nome Completo:</label>
          <input
            type="text"
            class="form-control input-mh"
            name="nome"
            [(ngModel)]="obj.nome"
            placeholder="Digite seu nome"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label form-label-mh">E-mail:</label>
          <input
            type="email"
            class="form-control input-mh"
            name="email"
            [(ngModel)]="obj.email"
            placeholder="Digite seu e-mail"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label form-label-mh">CPF (Documento):</label>
          <input
            type="text"
            class="form-control input-mh"
            name="documento"
            [(ngModel)]="obj.documento"
            placeholder="Digite seu CPF"
            required
          />
        </div>

        <div class="mb-4">
          <label class="form-label form-label-mh">Senha:</label>
          <input
            type="password"
            class="form-control input-mh"
            name="senha"
            [(ngModel)]="obj.senha"
            placeholder="Digite sua senha"
            required
          />
        </div>

        <button type="submit" class="btn btn-mh-submit w-100">
          Finalizar Cadastro
        </button>
      </form>

      <div class="text-center mt-3 pt-2 border-top">
        <span class="text-muted small">Já tem conta? </span>
        <a routerLink="/login" class="login-link small">Voltar para o Login</a>
      </div>
    </div>
  </div>
</div>

<div *ngIf="cadastroSucesso" class="modal-backdrop-mh">
  <div class="modal-card-mh text-center">
    <div class="check-circle mx-auto mb-3">✓</div>
    <h4 class="fw-bold text-dark mb-2">Cadastro Realizado!</h4>
    <p class="text-muted mb-4">{{ mensagem }}</p>
    <button type="button" class="btn btn-mh-submit w-100" (click)="fecharEIrParaLogin()">
      Ir para o Login
    </button>
  </div>
</div>
